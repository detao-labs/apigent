<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>注册 — Apigent UX Mockup</title>
<link rel="stylesheet" href="assets/mockup.css" />
</head>
<body>
<div class="mock-bar">
  <a href="index.html">← 返回目录</a>
  <span>Apigent Platform · UX 线框稿</span>
  <span class="spacer"></span>
  <span class="page-tag">/register</span>
</div>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="brand-mark">A</span>
      <span class="brand-name">Apigent <small>为Agent而生</small></span>
    </div>
    <h1>注册账号</h1>
    <p class="auth-sub">开始管理你的 API</p>
    <form id="registerForm" novalidate>
      <div class="field">
        <label>姓名</label>
        <input id="regName" type="text" placeholder="你的名字" />
      </div>
      <div class="field">
        <label>邮箱</label>
        <input id="regEmail" type="email" placeholder="you@example.com" />
      </div>
      <div class="field">
        <label>密码</label>
        <input id="regPwd" type="password" placeholder="至少 8 个字符" />
        <div class="hint" id="regErr" style="color:#b91c1c;display:none">请填写姓名、有效邮箱，且密码至少 8 位</div>
      </div>
      <button class="btn btn-primary btn-block" type="submit">创建账号</button>
    </form>
    <p class="auth-foot">已有账号？<a href="login.html">去登录</a></p>
  </div>
</div>
<script src="assets/mockup.js"></script>
<script>
document.getElementById("registerForm").addEventListener("submit", function (e) {
  e.preventDefault();
  var name = document.getElementById("regName").value.trim();
  var email = document.getElementById("regEmail").value.trim();
  var pwd = document.getElementById("regPwd").value;
  var err = document.getElementById("regErr");
  if (!name || !email || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email) || pwd.length < 8) {
    err.style.display = "block";
    showToast("请检查表单填写内容", "warn");
    return;
  }
  err.style.display = "none";
  showToast("注册成功，已自动登录");
  setTimeout(function () { window.location.href = "dashboard.html"; }, 700);
});
</script>
</body>
</html>
