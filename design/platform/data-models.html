        <div class="mc-fields">payment_id · order_id · channel · amount · paid_at</div>

<!-- 模型详情对话框 -->
<div class="overlay center" id="modelDialog">
  <div class="dialog">
    <div class="dialog-head">
      <h2><span class="mono" id="modelTitle">RefundResult</span></h2>
      <div class="sub" style="font-size:13px;color:var(--muted);margin-top:4px" id="modelDesc"></div>
    </div>
    <div class="dialog-body">
      <div id="modelFields"></div>
    </div>
    <div class="dialog-foot">
      <button class="btn btn-secondary" data-close="#modelDialog">关闭</button>
    </div>
  </div>
</div>
<script src="assets/mockup.js"></script>
<script>
document.querySelectorAll(".model-card").forEach(function (c) {
  c.addEventListener("click", function () {
    document.getElementById("modelTitle").textContent = c.getAttribute("data-name");
    document.getElementById("modelDesc").textContent = c.getAttribute("data-desc");
    var fields = c.getAttribute("data-fields").split("|").map(function (f) {
      var p = f.split(":");
      return '<div class="kv"><span class="k">' + p[0] + '</span><span class="v mono">' + p[1] + '</span></div>';
    }).join("");
    document.getElementById("modelFields").innerHTML = fields;
    openOverlay("#modelDialog");
  });
});
</script>
