# ═══════════════════════════════════════════════════════════════════
# Apigent — Configuration (SCHEME CHOICES)
# ═══════════════════════════════════════════════════════════════════
# Copy to apigent.config.yaml and customize:
#   cp apigent.config.example.yaml apigent.config.yaml
#
# ℹ️  Scheme choices only — provider / model / port / strategy.
#     Secrets (API keys, passwords, tokens, connection strings) go in .env.
#
# Priority: apigent.config.yaml > hardcoded defaults
#
# Status legend:
#   ✅ implemented & usable
#   🟡 config slot defined — runtime wiring pending
#   ⏳ planned / not implemented yet
# ═══════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────
# 1. Database — relational store (Drizzle ORM)
# ───────────────────────────────────────────────────────────────────
database:
  # "postgresql" ✅ | "mysql" ⏳ (planned — needs standalone vector / full-text / queue services)
  provider: postgresql

# ───────────────────────────────────────────────────────────────────
# 2. LLM — large language model provider + per-flow model selection
# ───────────────────────────────────────────────────────────────────
llm:
  # "qwen" ✅ | "openai" ✅ | "claude" ⏳（code also supports "ollama" ✅）
  # Implemented via packages/server/src/ai/model.ts (AI SDK) — used by
  # business-context generation and the agent runtime.
  provider: qwen

  # Per-flow model selection (each flow can use a different model)
  # ✅ business_context flow is actively used; other flows are ready via the adapter
  models:
    default: qwen3.7-plus
    business_context: qwen3.7-plus
    query_rewrite: qwen3.7-flash
    rag_answer: qwen3.7-plus
    editing: qwen3.7-plus

# ───────────────────────────────────────────────────────────────────
# 3. RAG — retrieval & ranking pipeline
# ───────────────────────────────────────────────────────────────────
rag:
  # 3.0 Whole-pipeline replacement (L0) — "builtin" | a package exporting createRagService
  provider: builtin

  # 3.1 Chunking — document splitting strategy
  chunkStrategy: hierarchical # "hierarchical" | "fixed" — 🟡 config slot defined, chunking pipeline not wired yet

  # 3.2 Vectorization & storage — dense / sparse backends
  embedding:
    # "qwen" | "openai" | "cohere" | "local-bge" | "local-fastembed" — ⏳ not implemented yet
    # no "claude": Anthropic ships no embedding API (removed in P3-5)
    provider: qwen
    model: text-embedding-v4 # 🟡 effective once an embedding provider is implemented

  vectorStore:
    # "memory" ✅ (local dev / tests) | "pgvector" | "milvus" | "chroma" ⏳ not implemented yet
    provider: pgvector
    # no index option: the ANN index is a DDL-time decision (HNSW in the schema);
    # see docs/modules/rag-package.md §12.2 for tunables and REINDEX guidance

  searchStore:
    # "pg-fts-jieba" (default) | "pg-fts-bigram" | "pg-fts-simple" | "none"
    # 🟡 config slot defined — sparse retrieval not wired to this setting yet (P4-5)
    provider: pg-fts-jieba

  # 3.3 Query rewriting — LLM query rewriting
  queryRewrite: true # 🟡 requires an LLM provider implementation
  queryRewriteCacheTtl: 3600 # seconds (1 hour)

  # 3.4 Retrieval & reranking
  retrieval:
    # 🟡 retrieval pipeline not implemented yet
    retrievalMode: hybrid # "hybrid" | "dense-only" | "sparse-only" | "kg-only"
    fusionMethod: rrf # "rrf" | "linear"
    # minScore 有意不设：合适的最低相似度等 Phase 7 的 golden set 定（见 P4-4 记录）
    coarseRankTopK: 20
    fineRankTopK: 10
    reranker:
      provider: qwen # "qwen" | "bge-reranker" | "cohere" | "none" — ⏳ not implemented yet
      model: qwen3-rerank

  # 3.5 Knowledge graph enhancement (default disabled)
  knowledgeGraph:
    enabled: false # ⏳ planned (V1+)

# ───────────────────────────────────────────────────────────────────
# 4. Storage — file / asset storage provider
# ───────────────────────────────────────────────────────────────────
storage:
  # "local" ✅ | "s3" ⏳ (MinIO is s3 + endpoint)
  provider: local
  basePath: ./data/uploads

# ───────────────────────────────────────────────────────────────────
# 5. Queue — async task / job queue
# ───────────────────────────────────────────────────────────────────
queue:
  # "postgres" ✅ (V0 default, reuses the database connection) | "memory" ✅ (tests only) | "bullmq" ⏳ (Redis)
  provider: postgres

# ───────────────────────────────────────────────────────────────────
# 6. Business Context — business context generation
# ───────────────────────────────────────────────────────────────────
businessContext:
  # ✅ end-to-end — generation calls createAIModel("business_context")
  # (qwen works today with a valid DASHSCOPE_API_KEY in .env)
  autoGenerate: false
  batchSize: 5
  concurrency: 2
  minConfidence: 0.6
  language: auto # "auto" | "zh" | "en"
  skipHumanEdited: true

# ───────────────────────────────────────────────────────────────────
# 7. Auth — authentication & SSO
# ───────────────────────────────────────────────────────────────────
auth:
  # "credentials" ✅ | "github" ⏳ | "google" ⏳
  providers:
    - credentials

# ───────────────────────────────────────────────────────────────────
# 8. MCP Gateway
# ───────────────────────────────────────────────────────────────────
mcp:
  # 🟡 config slot defined — MCP endpoint not mounted in apps/open yet
  path: /mcp
  transport: streamable-http
  # 可选：对外 MCP 服务地址（scheme://host[:port]）。留空则平台前端用当前 origin（协议+域名+端口）兜底。
  # publicUrl: https://mcp.example.com

# ───────────────────────────────────────────────────────────────────
# 9. Apps — organized by actual application (server is a shared module, not a standalone service)
# ───────────────────────────────────────────────────────────────────
apps:
  # ✅ listening ports come from the launch command (see CLAUDE.md → Port Conventions);
  #    logLevel drives request logging in apps/open
  platform:
    logLevel: info # "debug" | "info" | "warn" | "error"
  admin:
    logLevel: info
  open:
    logLevel: info
