# ═══════════════════════════════════════════════════════════════════
# Apigent — Configuration (SCHEME CHOICES) — EXAMPLE
# ═══════════════════════════════════════════════════════════════════
# Copy to apigent.config.yaml and customize:
#   cp apigent.config.example.yaml apigent.config.yaml
#
# ℹ️  Scheme choices only — provider / model / port / strategy.
#     Secrets (API keys, passwords, tokens, connection strings) go in .env.
#
# Priority: apigent.config.yaml > hardcoded defaults
#
# Status legend:
#   ✅ implemented & usable
#   🟡 config slot defined — runtime wiring pending
#   ⏳ planned / not implemented yet
#
# ⚠️  When switching provider, remove the fields of other providers in the same block
#     (config validation is strict — extra keys are rejected).
# ═══════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────
# 1. Database — relational store (Drizzle ORM)
# ───────────────────────────────────────────────────────────────────
database:
  # "postgresql" ✅ | "mysql" ⏳ (planned — needs standalone vector / full-text / queue services)
  provider: postgresql

# ───────────────────────────────────────────────────────────────────
# 2. LLM — large language model provider + per-flow model selection
# ───────────────────────────────────────────────────────────────────
llm:
  # "qwen" ✅ | "openai" ✅ | "claude" ⏳（code also supports "ollama" ✅）
  # Implemented via packages/server/src/ai/model.ts (AI SDK) — used by
  # business-context generation and the agent runtime.
  provider: qwen

  # Per-flow model selection (each flow can use a different model)
  # ✅ business_context flow is actively used; other flows are ready via the adapter
  models:
    default: qwen3.7-plus
    business_context: qwen3.7-plus
    query_rewrite: qwen3.7-flash
    rag_answer: qwen3.7-plus
    editing: qwen3.7-plus

  # --- Switch to Claude (⏳ not implemented yet) ---
  # provider: claude
  # models:
  #   default: claude-sonnet-5
  #   business_context: claude-sonnet-5
  #   query_rewrite: claude-haiku-4-5-20251001
  #   rag_answer: claude-sonnet-5
  #   editing: claude-sonnet-5

  # --- Switch to OpenAI (⏳ not implemented yet) ---
  # provider: openai
  # models:
  #   default: gpt-4o
  #   business_context: gpt-4o
  #   query_rewrite: gpt-4o-mini
  #   rag_answer: gpt-4o
  #   editing: gpt-4o

# ───────────────────────────────────────────────────────────────────
# 3. RAG — retrieval & ranking pipeline
# ───────────────────────────────────────────────────────────────────
rag:
  # 3.0 Whole-pipeline replacement (L0) — P0-6 / P3-7
  #
  # "builtin" (default) uses this repo's own pipeline. To swap the *entire* pipeline
  # for a third-party one (Dify / self-hosted / hosted service), point it at an
  # installed npm package that exports `createRagService` (or a default factory):
  # it receives { options, deps, telemetry?, clock?, createTraceId? } and must return
  # an object with index / retrieve / health. `@acme/…` is a placeholder scope.
  #
  #   provider: package
  #   package: "@acme/apigent-rag-qdrant"
  #   options: { endpoint: "https://rag.example.com" }
  #
  # A wrong/missing package fails at startup with a readable error, before any
  # request is served. Per-stage replacement (L1/L2) is configured further below.
  provider: builtin

  # 3.1 Chunking — document splitting strategy
  chunkStrategy: hierarchical # "hierarchical" | "fixed" — 🟡 config slot defined, chunking pipeline not wired yet

  # 3.2 Vectorization & storage — dense / sparse backends
  embedding:
    # "qwen" | "openai" | "cohere" | "local-bge" | "local-fastembed" — ⏳ not implemented yet
    # no "claude": Anthropic ships no embedding API (removed in P3-5)
    provider: qwen
    model: text-embedding-v4 # 🟡 effective once an embedding provider is implemented

  vectorStore:
    # "memory" ✅ (local dev / tests) | "pgvector" | "milvus" | "chroma" ⏳ not implemented yet
    provider: pgvector
    # No index option here on purpose: the ANN index (HNSW, vector_cosine_ops) is a
    # DDL-time decision baked into migration 0006's schema — changing it needs a
    # REINDEX + re-ingest, so it cannot be a YAML switch. Tunables (hnsw.ef_search,
    # m / ef_construction, when to REINDEX) live in docs/modules/rag-package.md §12.2.

    # --- Milvus (standalone service, ⏳ not implemented yet) ---
    # provider: milvus
    # host: localhost
    # port: 19530
    # collection: apigent_embeddings
    # user / password come from .env

    # --- Chroma (standalone service, ⏳ not implemented yet) ---
    # provider: chroma
    # url: http://localhost:8000
    # collection: apigent_embeddings

  searchStore:
    # Sparse (keyword) retrieval backend. All three pg-fts variants share the same
    # read/write path (app-side `search_text` → generated `search_vector` → GIN index);
    # they differ only in how text is segmented on the application side. Switching the
    # value changes `tokenizer_version` and therefore requires a full REINDEX.
    #   "pg-fts-jieba"  ✅ default — jieba `cutForSearch` + identifier normalisation
    #   "pg-fts-bigram" 🟡 CJK 2-gram — no native dependency, escape hatch if jieba breaks
    #   "pg-fts-simple" 🟡 English words + identifiers only; Chinese recall comes from dense
    #   "none"          🟡 no sparse path at all — retrieval degrades to dense-only
    # 🟡 config slot defined — sparse retrieval not wired to this setting yet (P4-5)
    provider: pg-fts-jieba

  # 3.3 Query rewriting — LLM query rewriting
  queryRewrite: true # 🟡 requires an LLM provider implementation
  queryRewriteCacheTtl: 3600 # seconds (1 hour)

  # 3.4 Retrieval & reranking
  retrieval:
    # 🟡 retrieval pipeline not implemented yet
    retrievalMode: hybrid # "hybrid" | "dense-only" | "sparse-only" | "kg-only"
    fusionMethod: rrf # "rrf" | "linear"
    # Dense-side minimum cosine similarity. Omit it (recommended for now) to disable the
    # threshold: the right value can only come from the golden set (Phase 7), and a
    # guessed value silently drops recall. When set, it is applied as an in-query SQL
    # condition before ORDER BY / LIMIT — never as post-filtering. Range: -1..1.
    #   minScore: 0.45
    coarseRankTopK: 20
    fineRankTopK: 10
    reranker:
      provider: qwen # "qwen" | "bge-reranker" | "cohere" | "none" — ⏳ not implemented yet
      model: qwen3-rerank

  # 3.5 Knowledge graph enhancement (default disabled)
  knowledgeGraph:
    enabled: false # ⏳ planned (V1+)

  # 3.6 第三方 provider（npm 包）—— 任何 rag.* 的 provider 都可以换成包实现
  #
  # 形态是显式判别：provider: package + package: <npm 包名> + options: <该包自己的配置>。
  # 为什么不让 provider 直接写包名：那会让上面这些 provider 联合类型的类型收窄失效、
  # 节点也失去未知键校验（写错 `options` 要到运行期才发现）。
  #
  # `@acme/…` 只是占位符 —— 换成你自己发布的 scope。本仓库自有的 `@apigent/*` 是
  # workspace 内部的私有包，别照抄：那样会让人（和 npm）以为官方提供了这些包。
  #
  # 约束：包必须已安装为依赖（不接受文件路径 —— 配置常被复制转发，路径会变成任意
  # 代码执行入口）；改完 YAML 重启即生效，启动期会校验包存在且导出形状正确。
  #
  # --- 局部替换示例：把向量库换成第三方实现 ---
  # vectorStore:
  #   provider: package
  #   package: "@acme/apigent-rag-qdrant"
  #   options:
  #     url: http://localhost:6333
  #     collection: apigent_embeddings
  #
  # --- 局部替换示例：embedding / reranker / 稀疏检索 ---
  # embedding:
  #   provider: package
  #   package: "@acme/apigent-embedding-v2"
  #   options:
  #     endpoint: https://embed.example.com
  # retrieval:
  #   reranker:
  #     provider: package
  #     package: "@acme/apigent-rerank-v2"
  # searchStore:
  #   provider: package
  #   package: "@acme/apigent-fts"

# ───────────────────────────────────────────────────────────────────
# 4. Storage — file / asset storage provider
# ───────────────────────────────────────────────────────────────────
storage:
  # "local" ✅ | "s3" ⏳ (MinIO is s3 + endpoint)
  provider: local
  basePath: ./data/uploads

  # --- S3 (⏳ not implemented yet) ---
  # provider: s3
  # bucket: apigent-uploads
  # region: us-east-1
  # accessKeyId / secretAccessKey come from .env

# ───────────────────────────────────────────────────────────────────
# 5. Queue — async task / job queue
# ───────────────────────────────────────────────────────────────────
queue:
  # "postgres" ✅ (V0 default, reuses the database connection) | "memory" ✅ (tests only) | "bullmq" ⏳ (Redis)
  provider: postgres

  # --- BullMQ (⏳ not implemented yet) ---
  # provider: bullmq
  # Redis URL from .env: APIGENT_REDIS_URL

# ───────────────────────────────────────────────────────────────────
# 6. Business Context — business context generation
# ───────────────────────────────────────────────────────────────────
businessContext:
  # ✅ end-to-end — generation calls createAIModel("business_context")
  # (qwen works today with a valid DASHSCOPE_API_KEY in .env)
  autoGenerate: false
  batchSize: 5
  concurrency: 2
  minConfidence: 0.6
  language: auto # "auto" | "zh" | "en"
  skipHumanEdited: true

# ───────────────────────────────────────────────────────────────────
# 7. Auth — authentication & SSO
# ───────────────────────────────────────────────────────────────────
auth:
  # "credentials" ✅ | "github" ⏳ | "google" ⏳
  providers:
    - credentials

# ───────────────────────────────────────────────────────────────────
# 8. MCP Gateway
# ───────────────────────────────────────────────────────────────────
mcp:
  # 🟡 config slot defined — MCP endpoint not mounted in apps/open yet
  path: /mcp
  transport: streamable-http
  # 可选：对外 MCP 服务地址（scheme://host[:port]）。留空则平台前端用当前 origin 兜底。
  # publicUrl: https://mcp.example.com

# ───────────────────────────────────────────────────────────────────
# 9.5 Observability — logs / metrics / traces
# ───────────────────────────────────────────────────────────────────
observability:
  # "none" ✅ (local structured logs to stdout — A/B 阶段) | "otlp" ⏳ (OpenTelemetry OTLP 导出，C 阶段 + SigNoz) | "langfuse" / "phoenix" ⏳ (LLM/RAG 专项，后置)
  provider: none
  # 本地日志级别
  logLevel: info

  # --- provider: otlp (⏳ C 阶段实现) — SigNoz / Grafana Cloud 等 OTLP 端点 ---
  # otlp:
  #   endpoint: http://localhost:4318
  #   headers: {}

  # --- provider: langfuse (⏳ 后置) — 公钥等 secret 走 .env ---
  # langfuse:
  #   baseUrl: https://cloud.langfuse.com

  # --- provider: phoenix (⏳ 后置) ---
  # phoenix:
  #   endpoint: http://localhost:6006

# ───────────────────────────────────────────────────────────────────
# 9. Apps — organized by actual application (server is a shared module, not a standalone service)
# ───────────────────────────────────────────────────────────────────
apps:
  # ✅ listening ports come from the launch command (see CLAUDE.md → Port Conventions);
  #    logLevel drives request logging in apps/open
  platform:
    logLevel: info # "debug" | "info" | "warn" | "error"
  admin:
    logLevel: info
  open:
    logLevel: info
