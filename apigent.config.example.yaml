# ═══════════════════════════════════════════════════════════════════
# Apigent — Configuration (SCHEME CHOICES)
# ═══════════════════════════════════════════════════════════════════
# Copy to apigent.config.yaml and customize:
#   cp apigent.config.example.yaml apigent.config.yaml
#
# ℹ️  This file contains scheme choices — which provider, which model,
#     which strategy to use. Secrets (API keys, passwords) go in .env
#
# Priority: apigent.config.yaml > apigent.config.yml > env vars > defaults
# ═══════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────
# 1. Database — relational store (Drizzle ORM)
# ───────────────────────────────────────────────────────────────────
database:
  # "postgresql" only — V0 schema is built on drizzle-orm/pg-core.
  # MySQL / SQLite are not supported yet.
  # Connection URL comes from .env: APIGENT_DATABASE_URL
  provider: postgresql

# ───────────────────────────────────────────────────────────────────
# 2. Vector Store — semantic / embedding search
# ───────────────────────────────────────────────────────────────────
vectorStore:
  # "pgvector" | "milvus" | "qdrant" | "weaviate" | "pinecone" | "chroma" | "memory"
  provider: pgvector

  # --- Memory (local development / tests only) ---
  # provider: memory

  # --- pgvector --- (uses same PostgreSQL, no extra config needed)
  # Index type: "ivfflat" | "hnsw"
  indexType: ivfflat

  # --- Milvus ---
  # host: localhost
  # port: 19530
  # collection: apigent_embeddings
  # user / password come from .env

  # --- Qdrant ---
  # url: http://localhost:6333
  # collection: apigent_embeddings
  # apiKey from .env: APIGENT_QDRANT_API_KEY

  # --- Weaviate ---
  # url: http://localhost:8080
  # apiKey from .env: APIGENT_WEAVIATE_API_KEY

  # --- Pinecone ---
  # environment: us-east-1
  # index: apigent-embeddings
  # apiKey from .env: APIGENT_PINECONE_API_KEY

  # --- Chroma ---
  # url: http://localhost:8000
  # collection: apigent_embeddings

# ───────────────────────────────────────────────────────────────────
# 3. LLM — large language model provider + per-flow model selection
# ───────────────────────────────────────────────────────────────────
llm:
  # "qwen" | "claude" | "openai" | "gemini" | "ollama"
  # API key comes from .env (DASHSCOPE_API_KEY / ANTHROPIC_API_KEY / etc.)
  provider: qwen

  # --- Per-flow model selection ---
  # Each flow can use a different model:
  #   - default:            fallback for any flow not specified
  #   - business_context:   analyze APIs → generate business descriptions
  #   - query_rewrite:      rewrite user search queries (cheap/fast model ok)
  #   - rag_answer:         generate final RAG answer from retrieved context
  #   - editing:            AI-assisted description editing (user-triggered)
  models:
    default: qwen3.7-plus
    business_context: qwen3.7-plus
    query_rewrite: qwen3.7-flash
    rag_answer: qwen3.7-plus
    editing: qwen3.7-plus

  # --- Example: switch to Claude ---
  # provider: claude
  # models:
  #   default: claude-sonnet-5
  #   business_context: claude-sonnet-5
  #   query_rewrite: claude-haiku-4-5-20251001
  #   rag_answer: claude-sonnet-5
  #   editing: claude-sonnet-5

  # --- Example: switch to OpenAI ---
  # provider: openai
  # models:
  #   default: gpt-4o
  #   business_context: gpt-4o
  #   query_rewrite: gpt-4o-mini
  #   rag_answer: gpt-4o
  #   editing: gpt-4o

  # --- Example: switch to Ollama (local) ---
  # provider: ollama
  # baseUrl: http://localhost:11434
  # models:
  #   default: llama3.1
  #   business_context: llama3.1
  #   query_rewrite: llama3.1
  #   rag_answer: llama3.1
  #   editing: llama3.1

# ───────────────────────────────────────────────────────────────────
# 4. Embedding — text → vector for semantic search
# ───────────────────────────────────────────────────────────────────
embedding:
  # "qwen" | "claude" | "openai" | "cohere" | "local-bge" | "local-fastembed"
  # API key comes from .env (uses same key as LLM for qwen/claude/openai)
  provider: qwen
  model: text-embedding-v4

  # --- Claude ---
  # provider: claude
  # model: claude-embedding

  # --- OpenAI ---
  # provider: openai
  # model: text-embedding-3-small
  #   text-embedding-3-small  → dimension 1536
  #   text-embedding-3-large  → dimension 3072

  # --- Cohere ---
  # provider: cohere
  # model: embed-multilingual-v3.0
  # API key from .env: APIGENT_COHERE_API_KEY

  # --- Local BGE (Chinese/English bilingual) ---
  # provider: local-bge
  # model: BAAI/bge-m3         # dimension 1024
  # device: cpu                # "cpu" | "cuda"

  # --- Local FastEmbed ---
  # provider: local-fastembed
  # model: BAAI/bge-small-en-v1.5
  # device: cpu

# ───────────────────────────────────────────────────────────────────
# 5. RAG — retrieval & ranking pipeline
# ───────────────────────────────────────────────────────────────────
rag:
  # Retrieval mode: "hybrid" | "dense-only" | "sparse-only" | "kg-only"
  retrievalMode: hybrid

  # Fusion method for hybrid retrieval: "rrf" | "linear"
  fusionMethod: rrf

  # Coarse rank — how many results before reranking
  coarseRankTopK: 20

  # Fine rank — how many results returned to user
  fineRankTopK: 10

  # Chunk strategy: "hierarchical" | "fixed"
  chunkStrategy: hierarchical

  # Query rewriting (LLM rewrites user query for better retrieval)
  queryRewrite: true
  queryRewriteCacheTtl: 3600 # seconds (1 hour)

  # Knowledge Graph enhancement (V1+, default disabled)
  # When enabled, hybrid retrieval adds graph-traversal recall
  knowledgeGraph:
    enabled: false

  # Reranker: "qwen" | "bge-reranker" | "cohere" | "none"
  reranker:
    provider: qwen
    model: qwen3-rerank
    # API key from .env: DASHSCOPE_API_KEY

  # --- Local BGE reranker (self-hosted) ---
  # reranker:
  #   provider: bge-reranker
  #   model: BAAI/bge-reranker-v2-m3
  #   device: cpu

  # --- Cohere reranker ---
  # reranker:
  #   provider: cohere
  #   model: rerank-multilingual-v3.0
  #   API key from .env: APIGENT_COHERE_API_KEY

  # --- No reranker ---
  # reranker:
  #   provider: none

# ───────────────────────────────────────────────────────────────────
# 6. Storage — file / asset storage provider
# ───────────────────────────────────────────────────────────────────
storage:
  # "local" | "s3" | "minio" | "gcs"
  provider: local
  basePath: ./data/uploads

  # --- S3 ---
  # provider: s3
  # bucket: apigent-uploads
  # region: us-east-1
  # Credentials from .env: APIGENT_STORAGE_S3_ACCESS_KEY_ID / SECRET_ACCESS_KEY

  # --- MinIO (S3-compatible) ---
  # provider: minio
  # bucket: apigent-uploads
  # region: us-east-1
  # endpoint: http://localhost:9000

  # --- Google Cloud Storage ---
  # provider: gcs
  # bucket: apigent-uploads
  # projectId: my-project

# ───────────────────────────────────────────────────────────────────
# 7. Queue — async task / job queue
# ───────────────────────────────────────────────────────────────────
queue:
  # "postgres"（V0 默认，复用现有 PostgreSQL，无需 Redis）
  # | "bullmq" | "rabbitmq" | "sqs" | "memory"（测试）
  provider: postgres

  # --- Postgres --- (uses the same database connection as `database`)

  # --- BullMQ (Redis) ---
  # provider: bullmq
  # Redis URL from .env: APIGENT_REDIS_URL

  # --- RabbitMQ ---
  # provider: rabbitmq
  # URL from .env: APIGENT_RABBITMQ_URL

  # --- AWS SQS ---
  # provider: sqs
  # region: us-east-1
  # queuePrefix: apigent-

  # --- In-memory (dev / testing only) ---
  # provider: memory

# ───────────────────────────────────────────────────────────────────
# 8. Auth — authentication & SSO
# ───────────────────────────────────────────────────────────────────
auth:
  # Enabled providers: [credentials, github, google]
  providers:
    - credentials
    # - github
    # - google

  # Session max age in seconds (default 7 days)
  sessionMaxAge: 604800

  # Secrets from .env: APIGENT_AUTH_SECRET, APIGENT_AUTH_GITHUB_*, APIGENT_AUTH_GOOGLE_*

# ───────────────────────────────────────────────────────────────────
# 9. MCP Gateway
# ───────────────────────────────────────────────────────────────────
mcp:
  path: /mcp
  transport: streamable-http

# ───────────────────────────────────────────────────────────────────
# 10. Server
# ───────────────────────────────────────────────────────────────────
server:
  host: "0.0.0.0"
  port: 3002 # API server port (webapp runs on 3000, admin on 3001)
  logLevel: info # "debug" | "info" | "warn" | "error"

# ───────────────────────────────────────────────────────────────────
# 11. Webapp URLs (for CORS, redirects, internal calls)
# ───────────────────────────────────────────────────────────────────
webapp:
  platformUrl: http://localhost:3000
  adminUrl: http://localhost:3001
  apiUrl: http://localhost:3002
